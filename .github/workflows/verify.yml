name: Verify

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.19.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Record verification inputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/taskforce-verification"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git ls-tree -r HEAD > "$evidence/tracked-tree.txt"
          git archive --format=tar.gz --output="$evidence/source.tar.gz" HEAD
          { node --version; npm --version; } > "$evidence/runtime.txt"
      - name: Record board workload measurements
        shell: bash
        run: |
          set -euo pipefail
          node tools/bench-board.mjs 1000 5000 > "$RUNNER_TEMP/taskforce-verification/board-bench.jsonl"
          node -e 'const fs=require("node:fs");for(const line of fs.readFileSync(process.argv[1],"utf8").trim().split("\n")){const r=JSON.parse(line);console.log(JSON.stringify({scenario:r.scenario,tasks:r.tasks,queries:r.queries,materialized_rows:r.materialized_rows,streamed_rows:r.streamed_rows,json_bytes:r.json_bytes,p50_ms:r.p50_ms,p95_ms:r.p95_ms}))}' "$RUNNER_TEMP/taskforce-verification/board-bench.jsonl"
      - name: Compare late-blocker query candidates
        shell: bash
        run: |
          set -euo pipefail
          node tools/probe-late-index.mjs 1000 5000 > "$RUNNER_TEMP/taskforce-verification/late-index-probe.jsonl"
          node -e 'const fs=require("node:fs");for(const line of fs.readFileSync(process.argv[1],"utf8").trim().split("\n")){const r=JSON.parse(line);if(r.kind==="late_index_measurement"){const plans=/unresolved_and_resolved_late|late_continue_25|scoped_heavy_first_25|terminal_tasks/.test(r.scenario)?r.late_plans:undefined;console.log(JSON.stringify({...r,late_plans:plans}))}else if(r.kind==="late_index_scope_checks"||r.kind==="late_index_probe_complete")console.log(JSON.stringify(r))}' "$RUNNER_TEMP/taskforce-verification/late-index-probe.jsonl"
      - name: Run npm test
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/taskforce-verification/offline.log"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: taskforce-verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
          path: ${{ runner.temp }}/taskforce-verification/
          if-no-files-found: error
          retention-days: 7
  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.19.0']
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned official DSH
        run: npm install --global --prefix "$RUNNER_TEMP/dsh-host" --no-audit --no-fund "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Pack exact deliverable and record inputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/taskforce-native"
          mkdir -p "$evidence" "$RUNNER_TEMP/taskforce-unpacked"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git ls-tree -r HEAD > "$evidence/tracked-tree.txt"
          git archive --format=tar.gz --output="$evidence/source.tar.gz" HEAD
          npm pack --offline --ignore-scripts --json --pack-destination "$evidence" > "$evidence/pack.json"
          PACK_FILE=$(node -e 'const fs=require("node:fs");const [entry]=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(entry.filename)' "$evidence/pack.json")
          test -n "$PACK_FILE" || { echo "pack.json did not yield a deliverable filename" >&2; exit 1; }
          tar -xzf "$evidence/$PACK_FILE" -C "$RUNNER_TEMP/taskforce-unpacked"
          (cd "$evidence" && sha256sum "$PACK_FILE" source.tar.gz > SHA256SUMS)
          { node --version; npm --version; } > "$evidence/runtime.txt"
          npm view "@deepseek-ai/dsh@${{ matrix.dsh }}" version dist.integrity --json > "$evidence/dsh-package.json"
      - name: Full acceptance of unpacked deliverable (no model requests)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/taskforce-unpacked/package"
          npm run test:all -- --install-anchor "$RUNNER_TEMP/dsh-host/lib/node_modules/@deepseek-ai/dsh/package.json" \
            2>&1 | tee "$RUNNER_TEMP/taskforce-native/acceptance.log"
      - name: Preserve deliverable and native acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: taskforce-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}-${{ matrix.dsh }}
          path: ${{ runner.temp }}/taskforce-native/
          retention-days: 14
          if-no-files-found: error
