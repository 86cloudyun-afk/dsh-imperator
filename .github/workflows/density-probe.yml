name: Same-run density probe

on:
  push:
    branches: ['codex/nextgen-density-probe']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  density:
    name: Density Node ${{ matrix.node }} blockers ${{ matrix.blockers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.19.0']
        blockers: [100000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Build local statement-counter extension and record source
        shell: bash
        run: |
          set -euo pipefail
          density_evidence="$RUNNER_TEMP/density-evidence"
          mkdir -p "$density_evidence"
          git rev-parse HEAD > "$density_evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$density_evidence/tree.txt"
          git ls-tree -r HEAD > "$density_evidence/tracked-tree.txt"
          git archive --format=tar.gz --output="$density_evidence/source.tar.gz" HEAD
          if ! test -f /usr/include/sqlite3ext.h; then
            sudo apt-get update -qq
            sudo apt-get install -y libsqlite3-dev
          fi
          cc -Wall -Wextra -Werror -O2 -fPIC -shared tools/probe-sqlite-status.c -o "$density_evidence/probe_status.so"
          node --version > "$density_evidence/node.txt"
          node --check tools/probe-run-density.mjs
      - name: Measure same-run blocker density
        shell: bash
        run: |
          set -euo pipefail
          density_evidence="$RUNNER_TEMP/density-evidence"
          node tools/probe-run-density.mjs --blockers=${{ matrix.blockers }} --rounds=10 --statistics=none --others=terminal --extension="$density_evidence/probe_status.so" | tee "$density_evidence/terminal-${{ matrix.blockers }}-none.jsonl"
          if test "${{ matrix.blockers }}" = 100000; then
            node tools/probe-run-density.mjs --blockers=100000 --rounds=10 --statistics=none --others=active --extension="$density_evidence/probe_status.so" | tee "$density_evidence/active-100000-none.jsonl"
          fi
          sha256sum "$density_evidence/source.tar.gz" "$density_evidence/probe_status.so" "$density_evidence/"*.jsonl > "$density_evidence/SHA256SUMS"
      - name: Archive exact probe evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: density-${{ github.run_id }}-${{ matrix.node }}-${{ matrix.blockers }}
          path: ${{ runner.temp }}/density-evidence/
          if-no-files-found: error
          retention-days: 14
