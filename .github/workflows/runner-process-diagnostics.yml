name: Original offline pipeline process diagnostics

on:
  push:
    branches: ['codex/audit-runner-process-guard-rejected']
    paths: ['.github/workflows/runner-process-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '4c43b7ec70f056e226775ebc029d7204cca7b5c3'
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Record verification inputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/taskforce-verification"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = '4c43b7ec70f056e226775ebc029d7204cca7b5c3'
          test "$(git rev-parse 'HEAD^{tree}')" = 'b8496770aac27db84a466f4f909cc35cc4268c62'
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git ls-tree -r HEAD > "$evidence/tracked-tree.txt"
          git archive --format=tar.gz --output="$evidence/source.tar.gz" HEAD
          { node --version; npm --version; } > "$evidence/runtime.txt"
      - name: Measure next-generation histories and exercise bounded faults
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/taskforce-verification"
          node tools/probe-nextgen.mjs --facts=100000 --events=100000 --rounds=10 | tee "$evidence/nextgen-current.jsonl"
          node tools/soak-nextgen.mjs --facts=10000 --events=10000 --rounds=5 | tee "$evidence/nextgen-soak.jsonl"
          git fetch --depth=1 origin 68b728ea2bc1958353d8a58bd77d47b0be7853d3
          baseline="$RUNNER_TEMP/nextgen-baseline"
          mkdir "$baseline"
          git archive 68b728ea2bc1958353d8a58bd77d47b0be7853d3 | tar -x -C "$baseline"
          cp tools/probe-nextgen.mjs "$baseline/tools/probe-nextgen.mjs"
          printf '%s\n' 68b728ea2bc1958353d8a58bd77d47b0be7853d3 > "$evidence/nextgen-baseline-commit.txt"
          cd "$baseline"
          node tools/probe-nextgen.mjs --facts=100000 --events=100000 --rounds=10 | tee "$evidence/nextgen-baseline.jsonl"
      - name: Record board workload measurements
        shell: bash
        run: |
          set -euo pipefail
          node tools/bench-board.mjs 1000 5000 > "$RUNNER_TEMP/taskforce-verification/board-bench.jsonl"
          node -e 'const fs=require("node:fs");for(const line of fs.readFileSync(process.argv[1],"utf8").trim().split("\n")){const r=JSON.parse(line);console.log(JSON.stringify({scenario:r.scenario,tasks:r.tasks,queries:r.queries,materialized_rows:r.materialized_rows,streamed_rows:r.streamed_rows,json_bytes:r.json_bytes,p50_ms:r.p50_ms,p95_ms:r.p95_ms}))}' "$RUNNER_TEMP/taskforce-verification/board-bench.jsonl"
      - name: Compare late-blocker query candidates
        shell: bash
        run: |
          set -euo pipefail
          node tools/probe-late-index.mjs 1000 5000 > "$RUNNER_TEMP/taskforce-verification/late-index-probe.jsonl"
          node -e 'const fs=require("node:fs");for(const line of fs.readFileSync(process.argv[1],"utf8").trim().split("\n")){const r=JSON.parse(line);if(r.kind==="late_index_measurement"){const plans=/unresolved_and_resolved_late|late_continue_25|scoped_heavy_first_25|terminal_tasks/.test(r.scenario)?r.late_plans:undefined;console.log(JSON.stringify({...r,late_plans:plans}))}else if(r.kind==="late_index_scope_checks"||r.kind==="late_index_probe_complete")console.log(JSON.stringify(r))}' "$RUNNER_TEMP/taskforce-verification/late-index-probe.jsonl"
      - name: Run original npm test pipeline with external bounded process sampling
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/taskforce-verification"
          node -e 'const os=require("node:os"),fs=require("node:fs");console.log(JSON.stringify({node:process.version,availableParallelism:os.availableParallelism(),cpuCount:os.cpus().length,cpusAllowedList:fs.readFileSync("/proc/self/status","utf8").split("\n").find(x=>x.startsWith("Cpus_allowed_list:")).split(":")[1].trim(),nodeOptionsPresent:Object.prototype.hasOwnProperty.call(process.env,"NODE_OPTIONS")}))' > "$evidence/proc-runtime.json"
          cat > "$evidence/proc-sampler.py" <<'PY'
          import datetime, json, os, pathlib, shutil, subprocess, sys, time
          
          root_pid = int(sys.argv[1])
          evidence = pathlib.Path(sys.argv[2])
          workspace = pathlib.Path.cwd()
          own_pid = os.getpid()
          started = time.monotonic()
          maximum_seconds = 95
          interval_seconds = 1
          tail_seconds = 2
          seen = {}
          stop_at = None
          
          cgroup_root = pathlib.Path('/sys/fs/cgroup')
          try:
              cgroup_lines = pathlib.Path('/proc/self/cgroup').read_text().splitlines()
              relative_group = next(line.split(':', 2)[2] for line in cgroup_lines if line.startswith('0::'))
              candidate_group = (cgroup_root / relative_group.lstrip('/')).resolve()
              if candidate_group.is_relative_to(cgroup_root):
                  cgroup_root = candidate_group
          except (OSError, StopIteration, ValueError):
              pass
          
          tracked = set(subprocess.check_output(['git', 'ls-files', 'tools'], text=True).splitlines())
          def read(path):
              try:
                  return pathlib.Path(path).read_text()
              except (OSError, UnicodeError):
                  return None
          
          def stat(pid, tid=None):
              path = f'/proc/{pid}/stat' if tid is None else f'/proc/{pid}/task/{tid}/stat'
              raw = read(path)
              if raw is None:
                  return None
              try:
                  fields = raw[raw.rfind(')') + 2:].split()
                  return {'pid': int(pid), 'ppid': int(fields[1]), 'state': fields[0],
                          'utime_ticks': int(fields[11]), 'stime_ticks': int(fields[12]),
                          'cutime_ticks': int(fields[13]), 'cstime_ticks': int(fields[14]),
                          'threads_count': int(fields[17]), 'starttime_ticks': int(fields[19]),
                          'rss_pages': int(fields[21])}
              except (ValueError, IndexError):
                  return None
          
          def integers(path, allowed):
              raw = read(path)
              if raw is None:
                  return None
              out = {}
              for line in raw.splitlines():
                  key, _, value = line.partition(':')
                  if key in allowed:
                      try:
                          out[key] = int(value.split()[0])
                      except (ValueError, IndexError):
                          pass
              return out
          
          def safe_command(pid):
              # Never emit raw argv or environment values. Only known repository source
              # paths and a small fixed set of flags can enter this public diagnostic.
              try:
                  args = pathlib.Path(f'/proc/{pid}/cmdline').read_bytes().split(b'\0')
                  args = [arg.decode('utf-8', errors='replace') for arg in args if arg]
              except OSError:
                  return {'kind': 'unavailable'}
              files, flags = [], []
              for arg in args:
                  candidate = arg
                  if arg.startswith(str(workspace) + os.sep):
                      candidate = arg[len(str(workspace)) + 1:]
                  if candidate in tracked:
                      files.append(candidate)
                  if arg in ('--test', '--check', 'source.js'):
                      flags.append(arg)
              try:
                  exe = pathlib.Path(os.readlink(f'/proc/{pid}/exe')).name
              except OSError:
                  exe = ''
              executable = exe if exe in ('node', 'bash', 'sh', 'dash', 'tee', 'python3', 'python3.12') else 'other'
              return {'executable': executable, 'tracked_source_files': files, 'fixed_flags': flags}
          
          def detail(row):
              pid = row['pid']
              before = stat(pid)
              if before is None or before['starttime_ticks'] != row['starttime_ticks']:
                  return None
              out = dict(row)
              out.update(safe_command(pid))
              out['wchan'] = read(f'/proc/{pid}/wchan')
              out['status_kb'] = integers(f'/proc/{pid}/status', {'VmRSS', 'VmHWM', 'VmSwap'})
              out['io'] = integers(f'/proc/{pid}/io', {'rchar', 'wchar', 'syscr', 'syscw', 'read_bytes', 'write_bytes', 'cancelled_write_bytes'})
              out['schedstat'] = read(f'/proc/{pid}/schedstat')
              try:
                  out['fd_count'] = len(list(pathlib.Path(f'/proc/{pid}/fd').iterdir()))
              except OSError:
                  out['fd_count'] = None
              threads = []
              try:
                  tids = list(pathlib.Path(f'/proc/{pid}/task').iterdir())
              except OSError:
                  tids = []
              for path in tids:
                  thread = stat(pid, path.name)
                  if thread is not None:
                      thread['tid'] = int(path.name)
                      thread['wchan'] = read(path / 'wchan')
                      thread['schedstat'] = read(path / 'schedstat')
                      threads.append(thread)
              out['threads'] = threads
              after = stat(pid)
              if after is None or after['starttime_ticks'] != row['starttime_ticks']:
                  return None
              return out
          
          def snapshot():
              global stop_at
              rows = {}
              for path in pathlib.Path('/proc').iterdir():
                  if path.name.isdigit():
                      row = stat(path.name)
                      if row is not None:
                          rows[row['pid']] = row
              included = {root_pid}
              included.update(pid for pid, start in seen.items()
                              if pid in rows and rows[pid]['starttime_ticks'] == start)
              changed = True
              while changed:
                  changed = False
                  for pid, row in rows.items():
                      if pid != own_pid and row['ppid'] in included and pid not in included:
                          included.add(pid)
                          changed = True
              descendants = []
              for pid in sorted(included):
                  if pid == own_pid or pid not in rows:
                      continue
                  row = rows[pid]
                  seen[pid] = row['starttime_ticks']
                  item = detail(row)
                  if item is not None:
                      descendants.append(item)
              now = time.monotonic()
              if (evidence / 'sampler.stop').exists() and stop_at is None:
                  stop_at = now
              fs = {}
              for label, path in [('workspace', workspace), ('evidence', evidence)]:
                  try:
                      usage = shutil.disk_usage(path)
                      fs[label] = {'total': usage.total, 'used': usage.used, 'free': usage.free}
                  except OSError:
                      fs[label] = None
              return {'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      'elapsed_seconds': round(now - started, 6), 'stop_observed': stop_at is not None,
                      'processes': descendants, 'cpu_stat': read('/proc/stat'),
                      'loadavg': read('/proc/loadavg'),
                      'memory_kb': integers('/proc/meminfo', {'MemTotal', 'MemAvailable', 'SwapTotal', 'SwapFree', 'Dirty', 'Writeback'}),
                      'pressure': {kind: read(f'/proc/pressure/{kind}') for kind in ('cpu', 'io', 'memory')},
                      'filesystem_bytes': fs,
                      'cgroup': {name: read(cgroup_root / name) for name in ('cpu.max', 'cpu.stat', 'cpu.pressure', 'io.stat', 'io.pressure', 'memory.current', 'memory.events', 'memory.pressure')}}
          
          with (evidence / 'process-samples.jsonl').open('w') as output:
              output.write(json.dumps({'kind': 'sampler_config', 'interval_seconds': interval_seconds,
                  'maximum_seconds': maximum_seconds, 'tail_seconds': tail_seconds,
                  'clock_ticks_per_second': os.sysconf('SC_CLK_TCK'), 'page_size': os.sysconf('SC_PAGE_SIZE'),
                  'root_pid': root_pid, 'sampler_pid': own_pid,
                  'argv_policy': 'known git-tracked tools paths and fixed --test/--check/source.js tokens only; no raw argv or environment values'}) + '\n')
              output.flush()
              samples = 0
              while True:
                  try:
                      output.write(json.dumps(snapshot()) + '\n')
                      samples += 1
                  except Exception as error:
                      output.write(json.dumps({'kind': 'sampler_error', 'type': type(error).__name__,
                                               'elapsed_seconds': round(time.monotonic() - started, 6)}) + '\n')
                  output.flush()
                  now = time.monotonic()
                  if now - started >= maximum_seconds or (stop_at is not None and now - stop_at >= tail_seconds):
                      output.write(json.dumps({'kind': 'sampler_complete', 'samples': samples,
                          'elapsed_seconds': round(now - started, 6), 'stop_observed': stop_at is not None}) + '\n')
                      output.flush()
                      break
                  time.sleep(min(interval_seconds, max(0, started + maximum_seconds - now)))
          PY
          python3 "$evidence/proc-sampler.py" "$$" "$evidence" < /dev/null > "$evidence/sampler.stdout.log" 2> "$evidence/sampler.stderr.log" &
          sampler_pid=$!
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > "$evidence/npm-started.txt"
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/taskforce-verification/offline.log"
          pipeline_status=("${PIPESTATUS[@]}")
          pipeline_exit=0
          for code in "${pipeline_status[@]}"; do
            if [ "$code" -ne 0 ]; then pipeline_exit="$code"; fi
          done
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > "$evidence/npm-finished.txt"
          printf '%s\n' "${pipeline_status[@]}" > "$evidence/pipeline-status.txt"
          touch "$evidence/sampler.stop"
          wait "$sampler_pid"
          sampler_exit=$?
          printf '%s\n' "$sampler_exit" > "$evidence/sampler-status.txt"
          python3 - "$evidence" "$pipeline_exit" <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          evidence = pathlib.Path(sys.argv[1])
          raw = (evidence / 'offline.log').read_bytes()
          text = raw.decode('utf-8', errors='replace')
          sample_lines = (evidence / 'process-samples.jsonl').read_text().splitlines()
          samples = [json.loads(line) for line in sample_lines]
          result = {
              'input_commit': (evidence / 'commit.txt').read_text().strip(),
              'input_tree': (evidence / 'tree.txt').read_text().strip(),
              'runtime': json.loads((evidence / 'proc-runtime.json').read_text()),
              'verify_all_blob': subprocess.check_output(['git', 'rev-parse', 'HEAD:tools/verify-all.mjs'], text=True).strip(),
              'host_runtime_test_blob': subprocess.check_output(['git', 'rev-parse', 'HEAD:tools/tests/host-runtime.test.mjs'], text=True).strip(),
              'npm_started_utc': (evidence / 'npm-started.txt').read_text().strip(),
              'npm_finished_utc': (evidence / 'npm-finished.txt').read_text().strip(),
              'pipeline_status': [int(value) for value in (evidence / 'pipeline-status.txt').read_text().split()],
              'original_pipefail_exit': int(sys.argv[2]),
              'aggregate_timed_out': bool(re.search(r'^node:test: FAILED.*\(timeout\)', text, re.MULTILINE)),
              'sampler_exit': int((evidence / 'sampler-status.txt').read_text()),
              'sampler_samples': sum('processes' in item for item in samples),
              'sampler_errors': [item for item in samples if item.get('kind') == 'sampler_error'],
              'sampler_complete': [item for item in samples if item.get('kind') == 'sampler_complete'],
              'verification_summary': [line for line in text.splitlines() if re.match(r'^(verify-|node:test:|host integration:)', line)],
              'test_summary': [line for line in text.splitlines() if re.match(r'^(?:#|ℹ) (tests|pass|fail|cancelled|skipped|duration_ms) ', line)],
              'output_policy': 'original npm stderr/stdout merged by unchanged 2>&1 | tee; not independent streams',
              'deadline_policy': 'original source 60s child / 12s cleanup test; sampler <=95s and 2s tail; original outer10min; no affinity/reporter/concurrency override',
          }
          (evidence / 'proc-result.json').write_text(json.dumps(result, indent=2) + '\n')
          hashes = {}
          for path in sorted(evidence.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS':
                  hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (evidence / 'SHA256SUMS').write_text(''.join(digest + '  ' + name + '\n' for name, digest in hashes.items()))
          print('RUNNER_PROC_RESULT ' + json.dumps(result), flush=True)
          print('RUNNER_PROC_HASHES ' + json.dumps(hashes), flush=True)
          print('PROCESS_SAMPLES_BEGIN', flush=True)
          print('\n'.join(sample_lines), flush=True)
          print('PROCESS_SAMPLES_END', flush=True)
          PY
          # Diagnostics must not substitute their exit code for the original pipeline.
          exit "$pipeline_exit"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-proc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}
          path: ${{ runner.temp }}/taskforce-verification/
          if-no-files-found: error
          retention-days: 7
